<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カメラ照度計</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #0f172a;
    color: #ffffff;
  }
  .app-container {
    text-align: center;
    background: #1e293b;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    border: 1px solid #334155;
    width: 85%;
    max-width: 360px;
  }
  .title {
    margin: 0 0 20px 0;
    font-size: 20px;
    color: #38bdf8;
  }
  .lux-display {
    font-size: 64px;
    font-weight: bold;
    color: #38bdf8;
    line-height: 1;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .unit {
    font-size: 16px;
    color: #94a3b8;
    margin-bottom: 25px;
  }
  button {
    background: #38bdf8;
    color: #0f172a;
    border: none;
    padding: 14px 28px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
    transition: opacity 0.2s;
  }
  button:active { opacity: 0.8; }
  #msg {
    color: #ef4444;
    font-size: 13px;
    margin-top: 15px;
    min-height: 16px;
  }
  video, canvas { display: none; }
</style>
</head>
<body>

<div class="app-container">
  <h2 class="title">📷 簡易カメラ照度計</h2>
  <div class="lux-display" id="lux-val">---</div>
  <div class="unit">LUX (ルクス)</div>
  <button id="start-btn" onclick="startApp()">測定スタート</button>
  <div id="msg"></div>
</div>

<video id="cam-video" autoplay playsinline muted></video>
<canvas id="cam-canvas"></canvas>

<script>
  const video = document.getElementById('cam-video');
  const canvas = document.getElementById('cam-canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const luxVal = document.getElementById('lux-val');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('start-btn');
  let isRunning = false;

  async function startApp() {
    if (isRunning) return;
    msg.textContent = "カメラを準備中...";
    
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      });
      
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        video.play();
        isRunning = true;
        btn.style.display = 'none';
        msg.textContent = "";
        analyzeFrame();
      };
    } catch (err) {
      msg.textContent = "カメラへのアクセスが拒否されたか、利用できません。";
    }
  }

  function analyzeFrame() {
    if (!isRunning) return;

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = 32;
      canvas.height = 32;
      ctx.drawImage(video, 0, 0, 32, 32);
      
      const imgData = ctx.getImageData(0, 0, 32, 32).data;
      let totalLuminance = 0;
      
      for (let i = 0; i < imgData.length; i += 4) {
        const r = imgData[i], g = imgData[i+1], b = imgData[i+2];
        totalLuminance += (0.2126 * r + 0.7152 * g + 0.0722 * b);
      }
      
      const avgLuminance = totalLuminance / (imgData.length / 4);
      let lux = Math.pow(avgLuminance / 255, 2.5) * 2000;
      luxVal.textContent = Math.max(1, Math.round(lux));
    }
    
    setTimeout(() => requestAnimationFrame(analyzeFrame), 200);
  }
</script>

</body>
</html>
